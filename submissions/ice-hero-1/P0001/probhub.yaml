schema_version: 1
id: P0001
name: 冰之勇者记1
display_name: 冰之勇者记1
difficulty: 0
tags:
- BFS
- 图
- 网格
limits:
  time: 1
  memory: 256
  output: 64
  processes: 32
statement:
  source: problem.md
  quote:
    text: 哪怕世界只剩两条窄路，也总有勇者愿意出发。
    source: 智慧冰精
judge:
  type: standard
  validator: code/validator.cpp
solutions:
  accepted:
  - file: code/std.cpp
    expected:
      status: AC
      all: true
  - file: code/std2.cpp
    expected:
      status: AC
      all: true
    independence:
      from: code/std.cpp
      basis: algorithm
      note: std.cpp 使用四方向 BFS 逐格扩展；std2.cpp 使用按列递推的连通性 DP，只保留当前列两行的可达状态，两者算法不同且不共享核心代码。
  brute: []
  wrong:
  - file: code/wrong.cpp
    expected:
      status: WA
      groups:
      - multi-switch
      all: false
      forbid:
      - FAIL
  - file: code/wrong2.cpp
    expected:
      status: WA
      groups:
      - multi-switch
      all: false
      forbid:
      - FAIL
  - file: code/wrong3.cpp
    expected:
      status:
      - TLE
      groups:
      - open-max
      all: false
      forbid:
      - WA
      - FAIL
  - file: code/wrong4.cpp
    expected:
      status: WA
      groups:
      - open-max
      all: false
      forbid:
      - FAIL
generators:
- code/inmaker.cpp
data:
  sample_dir: data/sample
  secret_dir: data/secret
  groups:
  - name: boundary
    role: boundary
    patterns:
    - secret/edge*
  - name: multi-switch
    role: wrong-solution-killer
    patterns:
    - secret/switch*
    targets:
    - code/wrong.cpp
    - code/wrong2.cpp
  - name: open-max
    role: wrong-solution-killer
    patterns:
    - secret/open*
    targets:
    - code/wrong3.cpp
    - code/wrong4.cpp
  - name: large
    role: performance
    patterns:
    - secret/corridor*
    - secret/wall*
  - name: random
    role: random-supplement
    patterns:
    - secret/random*
  recipes:
  - case: edge01
    manual: true
  - case: edge02
    manual: true
  - case: edge03
    manual: true
  - case: edge04
    manual: true
  - case: edge05
    manual: true
  - case: switch01
    manual: true
  - case: switch02
    manual: true
  - case: switch03
    generator: code/inmaker.cpp
    args:
    - switch
  - case: open01
    generator: code/inmaker.cpp
    args:
    - open
  - case: corridor01
    generator: code/inmaker.cpp
    args:
    - corridor
  - case: wall01
    generator: code/inmaker.cpp
    args:
    - wall
  - case: random01
    generator: code/inmaker.cpp
    args:
    - random
    - '1'
  - case: random02
    generator: code/inmaker.cpp
    args:
    - random
    - '2'
  - case: random03
    generator: code/inmaker.cpp
    args:
    - random
    - '3'
  - case: random04
    generator: code/inmaker.cpp
    args:
    - random
    - '4'
  - case: random05
    generator: code/inmaker.cpp
    args:
    - random
    - '5'
domjudge:
  include_pdf: false
stress:
  generator: code/inmaker.cpp
  args:
  - random
  - '{seed}'
  brute: code/std2.cpp
  rounds: 100
  time_limit: 1
  tool_timeout: 5
