schema_version: 1
id: P0001
name: 小笼包
display_name: 小笼包
difficulty: 0
tags:
- 数论
- 最大公约数
limits:
  time: 1
  memory: 256
  output: 64
  processes: 32
statement:
  source: problem.md
  quote:
    text: 我才不是你们抓的，偷小笼包的洛天依！
    source: 洛天依
judge:
  type: standard
  validator: code/validator.cpp
solutions:
  accepted:
  - file: code/std.cpp
    expected:
      status: AC
      all: true
  - file: code/std2.cpp
    expected:
      status: AC
      all: true
    independence:
      from: code/std.cpp
      basis: algorithm
      note: std.cpp 使用欧几里得除法迭代求 gcd；std2.cpp 使用二进制 gcd（Stein 算法），通过去除公因子 2、移位和减法求 gcd，两者算法不同且不共享核心代码。
  brute: []
  wrong:
  - file: code/wrong.cpp
    expected:
      status: WA
      groups:
      - common-odd
      all: false
      forbid:
      - FAIL
  - file: code/wrong2.cpp
    expected:
      status: WA
      groups:
      - multi-gcd
      all: false
      forbid:
      - FAIL
  - file: code/wrong3.cpp
    expected:
      status:
      - TLE
      groups:
      - subtract-tle
      all: false
      forbid:
      - WA
      - FAIL
  - file: code/wrong4.cpp
    expected:
      status: WA
      groups:
      - min-trap
      all: false
      forbid:
      - FAIL
generators:
- code/inmaker.cpp
data:
  sample_dir: data/sample
  secret_dir: data/secret
  groups:
  - name: boundary
    role: boundary
    patterns:
    - secret/edge*
  - name: common-odd
    role: wrong-solution-killer
    patterns:
    - secret/odd*
    targets:
    - code/wrong.cpp
  - name: multi-gcd
    role: wrong-solution-killer
    patterns:
    - secret/multi*
    targets:
    - code/wrong2.cpp
  - name: min-trap
    role: wrong-solution-killer
    patterns:
    - secret/edge04
    - secret/multi*
    targets:
    - code/wrong4.cpp
  - name: subtract-tle
    role: performance
    patterns:
    - secret/edge03
    targets:
    - code/wrong3.cpp
  - name: large
    role: performance
    patterns:
    - secret/large*
    - secret/odd04
  - name: random
    role: random-supplement
    patterns:
    - secret/random*
  recipes:
  - case: edge01
    manual: true
  - case: edge02
    manual: true
  - case: edge03
    manual: true
  - case: edge04
    manual: true
  - case: edge05
    manual: true
  - case: edge06
    manual: true
  - case: odd01
    manual: true
  - case: odd02
    manual: true
  - case: odd03
    manual: true
  - case: multi01
    manual: true
  - case: multi02
    manual: true
  - case: large01
    generator: code/inmaker.cpp
    args:
    - large_yes
  - case: large02
    generator: code/inmaker.cpp
    args:
    - large_random
  - case: odd04
    generator: code/inmaker.cpp
    args:
    - odd_common
  - case: random01
    generator: code/inmaker.cpp
    args:
    - random
    - '1'
  - case: random02
    generator: code/inmaker.cpp
    args:
    - random
    - '2'
domjudge:
  include_pdf: false
stress:
  generator: code/inmaker.cpp
  args:
  - random
  - '{seed}'
  brute: code/std2.cpp
  rounds: 100
  time_limit: 1
  tool_timeout: 5
