schema_version: 1
id: P0001
name: 斯卡雷特警察巡逻贫民区24时
display_name: 斯卡雷特警察巡逻贫民区24时
difficulty: 0
tags:
- 多源BFS
- BFS
- 图
- 网格
limits:
  time: 1
  memory: 256
  output: 64
  processes: 32
statement:
  source: problem.md
  quote:
    text: 异变不会等人，但警察可以比它更快一步。
    source: 智慧冰精
judge:
  type: standard
  validator: code/validator.cpp
solutions:
  accepted:
  - file: code/std.cpp
    expected:
      status: AC
      all: true
  - file: code/std2.cpp
    expected:
      status: AC
      all: true
    independence:
      from: code/std.cpp
      basis: key_implementation
      note: std.cpp 把所有邪恶冰精入队后用普通队列逐点扩展；std2.cpp 把网格压成一维编号，用两层 vector 按“当前感染层/下一感染层”整体推进，核心数据结构与扩展方式均不同，不共享代码。
  brute: []
  wrong:
  - file: code/wrong.cpp
    expected:
      status: WA
      groups:
      - multi-source
      all: false
      forbid:
      - FAIL
  - file: code/wrong2.cpp
    expected:
      status: WA
      groups:
      - boundary
      all: false
      forbid:
      - FAIL
  - file: code/wrong3.cpp
    expected:
      status:
      - TLE
      groups:
      - many-sources
      all: false
      forbid:
      - WA
      - FAIL
  - file: code/wrong4.cpp
    expected:
      status: WA
      groups:
      - corner
      all: false
      forbid:
      - FAIL
generators:
- code/inmaker.cpp
data:
  sample_dir: data/sample
  secret_dir: data/secret
  groups:
  - name: boundary
    role: boundary
    patterns:
    - secret/edge*
  - name: multi-source
    role: wrong-solution-killer
    patterns:
    - secret/multi*
    targets:
    - code/wrong.cpp
  - name: many-sources
    role: performance
    patterns:
    - secret/many*
    targets:
    - code/wrong3.cpp
  - name: corner
    role: wrong-solution-killer
    patterns:
    - secret/corner*
    - secret/line*
    targets:
    - code/wrong4.cpp
  - name: random
    role: random-supplement
    patterns:
    - secret/random*
  recipes:
  - case: edge01
    manual: true
  - case: edge02
    manual: true
  - case: edge03
    manual: true
  - case: edge04
    manual: true
  - case: multi01
    manual: true
  - case: multi02
    manual: true
  - case: corner01
    generator: code/inmaker.cpp
    args:
    - corner
    - '1000'
    - '1000'
  - case: line01
    generator: code/inmaker.cpp
    args:
    - line
    - '1000'
  - case: many01
    generator: code/inmaker.cpp
    args:
    - many
    - '1000'
    - '1000'
    - '50000'
  - case: many02
    generator: code/inmaker.cpp
    args:
    - many
    - '500'
    - '500'
    - '20000'
  - case: random01
    generator: code/inmaker.cpp
    args:
    - random
    - '1'
    - '20'
    - '20'
    - '3'
  - case: random02
    generator: code/inmaker.cpp
    args:
    - random
    - '2'
    - '50'
    - '80'
    - '500'
  - case: random03
    generator: code/inmaker.cpp
    args:
    - random
    - '3'
    - '120'
    - '120'
    - '2000'
  - case: random04
    generator: code/inmaker.cpp
    args:
    - random
    - '4'
    - '400'
    - '600'
    - '30000'
  - case: random05
    generator: code/inmaker.cpp
    args:
    - random
    - '5'
    - '999'
    - '1000'
    - '200000'
stress:
  generator: code/inmaker.cpp
  args:
  - random
  - '{seed}'
  brute: code/std2.cpp
  rounds: 100
  time_limit: 1
  tool_timeout: 5
domjudge:
  include_pdf: false
