schema_version: 1
id: P0001
name: 蓝蓝路
display_name: 蓝蓝路
difficulty: 0
tags:
- 数论
- 质数
- 埃氏筛
limits:
  time: 1
  memory: 256
  output: 64
  processes: 32
statement:
  source: problem.md
  quote:
    text: 蓝🙏——蓝🙏——路🙌——
    source: 蓝蓝路
judge:
  type: standard
  validator: code/validator.cpp
solutions:
  accepted:
  - file: code/std.cpp
    expected:
      status: AC
      all: true
  - file: code/std2.cpp
    expected:
      status: AC
      all: true
    independence:
      from: code/std.cpp
      basis: algorithm
      note: std.cpp 使用埃氏筛预处理质数；std2.cpp 使用线性筛（欧拉筛）预处理，二者的筛法和核心循环不同，查询部分也各自独立实现。
  brute: []
  wrong:
  - file: code/wrong.cpp
    expected:
      status: WA
      groups:
      - mixed
      all: false
      forbid:
      - FAIL
  - file: code/wrong2.cpp
    expected:
      status: WA
      groups:
      - impossible
      all: false
      forbid:
      - FAIL
  - file: code/wrong3.cpp
    expected:
      status:
      - TLE
      groups:
      - prime-heavy
      - max-t
      - late
      all: false
      forbid:
      - WA
      - FAIL
  - file: code/wrong4.cpp
    expected:
      status: WA
      groups:
      - mixed
      - powers
      all: false
      forbid:
      - FAIL
generators:
- code/inmaker.cpp
data:
  sample_dir: data/sample
  secret_dir: data/secret
  groups:
  - name: boundary
    role: boundary
    patterns:
    - secret/edge*
  - name: mixed
    role: wrong-solution-killer
    patterns:
    - secret/mixed*
    targets:
    - code/wrong.cpp
  - name: impossible
    role: wrong-solution-killer
    patterns:
    - secret/impossible*
    targets:
    - code/wrong2.cpp
  - name: powers
    role: wrong-solution-killer
    patterns:
    - secret/powers*
    targets:
    - code/wrong4.cpp
  - name: prime-heavy
    role: performance
    patterns:
    - secret/prime*
    targets:
    - code/wrong3.cpp
  - name: max-t
    role: performance
    patterns:
    - secret/max*
    targets:
    - code/wrong3.cpp
  - name: late
    role: performance
    patterns:
    - secret/late*
    targets:
    - code/wrong3.cpp
  - name: random
    role: random-supplement
    patterns:
    - secret/small*
    - secret/random*
  recipes:
  - case: edge01
    manual: true
  - case: edge02
    manual: true
  - case: edge03
    manual: true
  - case: edge04
    manual: true
  - case: mixed01
    manual: true
  - case: mixed02
    manual: true
  - case: impossible01
    manual: true
  - case: powers01
    manual: true
  - case: prime01
    generator: code/inmaker.cpp
    args:
    - prime
  - case: max01
    generator: code/inmaker.cpp
    args:
    - max
  - case: late01
    generator: code/inmaker.cpp
    args:
    - late
  - case: impossible02
    generator: code/inmaker.cpp
    args:
    - impossible
  - case: small01
    generator: code/inmaker.cpp
    args:
    - small
  - case: random01
    generator: code/inmaker.cpp
    args:
    - random
    - '1'
  - case: random02
    generator: code/inmaker.cpp
    args:
    - random
    - '2'
domjudge:
  include_pdf: false
stress:
  generator: code/inmaker.cpp
  args:
  - random
  - '{seed}'
  brute: code/std2.cpp
  rounds: 100
  time_limit: 1
  tool_timeout: 5
